# Скопируйте в config.yaml и поправьте под себя.

# Как вас зовут — двойник будет говорить о вас в третьем лице: «Светлана сейчас в отпуске».
owner_name: Светлана

persona_file: persona.md        # описание личности
examples_file: data/examples.md # примеры вашего стиля (scripts/extract_examples.py)
knowledge_dir: knowledge        # база знаний: любые .md и .txt файлы о вас
db_file: data/twin.db           # память: история чатов, факты, исправления

# Что двойник ответит незнакомцу в личке, пока вы не разрешили с ним общаться.
# Пустая строка — молчать.
stranger_reply: "Привет! Я цифровой двойник Светланы. Сейчас уточню, можно ли нам пообщаться."

# Присылать вам копии ответов двойника в личных чатах, чтобы их можно было поправить.
report_private: true

behavior:
  history_limit: 40             # сколько последних сообщений чата видит модель
  debounce_seconds: 6           # ждать, пока собеседник допишет серию сообщений
  min_delay_seconds: 2          # случайная пауза перед ответом
  max_delay_seconds: 10
  typing_chars_per_second: 12   # «печатает...» длится пропорционально длине ответа
  max_replies_per_hour: 30      # на один чат
  owner_active_minutes: 10      # если вы сами пишете в группе, двойник не вмешивается
  ignore_bots: true

llm:
  model: claude-opus-5-5
  effort: low        # low | medium | high — выше точнее, но дольше и дороже
  max_tokens: 16000
